services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: gualph
      POSTGRES_USER: gualph
      POSTGRES_PASSWORD: gualph_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gualph -d gualph"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - gualph_postgres:/var/lib/postgresql/data

volumes:
  gualph_postgres:
